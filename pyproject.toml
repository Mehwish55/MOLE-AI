[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mole-ai"
version = "0.1.0"
description = "An open-source toolkit for multi-objective AI drug design"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
]
[tool.setuptools.packages.find]
include = ["mole_ai*"]

[tool.setuptools.package-data]
mole_ai = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
