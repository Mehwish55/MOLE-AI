[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mole-ai"
version = "0.1.0"
description = "An open-source toolkit for multi-objective AI drug design"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "rdkit",
    "Pillow",
    "joblib",
    "streamlit==1.59.2",
    "plotly==6.9.0",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["mole_ai*"]

[tool.setuptools.package-data]
mole_ai = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
